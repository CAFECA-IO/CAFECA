<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 690" width="960" height="690" role="img" aria-labelledby="t d" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><title id="t">Sign in with CAFECA 運作流程</title><desc id="d">網站後端發 nonce，使用者在 CAFECA 錢包確認網域並以 Passkey 簽署 SignIn，網站後端以公開 RPC 呼叫 isValidSignature 與 statusOf 驗證，最後建立自己的 session。</desc><style>text{font-family:-apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang TC", "Noto Sans TC", "Noto Sans CJK TC", "Microsoft JhengHei", sans-serif;}.bg{fill:#faf6fc}.frame{fill:none;stroke:#eadcf0}.t1{fill:#2a1f33}.t2{fill:#5e5168}.t3{fill:#8a7d93}.ln{stroke:#e3d3ea}.card{fill:#ffffff}.cardl{stroke:#e3d3ea}.grp{fill:#ffffff}.grpl{stroke:#e3d3ea}.ac{fill:#8e3fa0}.acs{stroke:#8e3fa0}.ac2{fill:#c0428e}.ac2s{stroke:#c0428e}.note{fill:#fff7ec}.chip{fill:#f4eaf7}.onac{fill:#ffffff}.band0{fill:#8e3fa0}.bands0{stroke:#8e3fa0}.tint0{fill:#f4eaf7}.band1{fill:#c0428e}.bands1{stroke:#c0428e}.tint1{fill:#fbe9f2}.band2{fill:#e08a2c}.bands2{stroke:#e08a2c}.tint2{fill:#fdf1e2}.band3{fill:#5b4a68}.bands3{stroke:#5b4a68}.tint3{fill:#f1edf4}@media (prefers-color-scheme: dark){.bg{fill:#17111d}.frame{fill:none;stroke:#2f2538}.t1{fill:#f3eaf7}.t2{fill:#c3b4cc}.t3{fill:#8f7f99}.ln{stroke:#3a2d45}.card{fill:#221a2b}.cardl{stroke:#3a2d45}.grp{fill:#1d1625}.grpl{stroke:#3a2d45}.ac{fill:#c48bd4}.acs{stroke:#c48bd4}.ac2{fill:#e0629f}.ac2s{stroke:#e0629f}.note{fill:#2b2118}.chip{fill:#2d2038}.onac{fill:#ffffff}.tint0{fill:#2d2038}.tint1{fill:#351d2c}.tint2{fill:#33261a}.tint3{fill:#262030}}</style><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" class="ac"/></marker><marker id="ah2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" class="ac2"/></marker><filter id="sh" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#5b2a6b" flood-opacity="0.12"/></filter><linearGradient id="gr" x1="0" x2="1" y1="0" y2="0"><stop offset="0" stop-color="#8e3fa0"/><stop offset="0.6" stop-color="#c0428e"/><stop offset="1" stop-color="#f0a040"/></linearGradient></defs><rect x="0.5" y="0.5" width="959" height="689" rx="12" class="bg"/><rect x="0.5" y="0.5" width="959" height="689" rx="12" class="frame"/><rect x="32" y="22" width="6" height="26" rx="3" fill="url(#gr)"/><text x="48" y="42" class="t1" font-size="20" font-weight="700" text-anchor="start">Sign in with CAFECA 運作流程</text><text x="48" y="64" class="t2" font-size="13" font-weight="400" text-anchor="start">CAFECA 伺服器不參與驗證：網站後端只讀公開鏈上資料</text><g filter="url(#sh)"><rect x="74.0" y="92" width="112" height="32" rx="16" class="band0"/></g><text x="130" y="113" class="onac" font-size="13.5" font-weight="700" text-anchor="middle">使用者瀏覽器</text><path d="M130 124 V650" class="bands0" stroke-width="1.5" stroke-dasharray="2 5" stroke-linecap="round"/><g filter="url(#sh)"><rect x="314.0" y="92" width="112" height="32" rx="16" class="band1"/></g><text x="370" y="113" class="onac" font-size="13.5" font-weight="700" text-anchor="middle">你的網站後端</text><path d="M370 124 V650" class="bands1" stroke-width="1.5" stroke-dasharray="2 5" stroke-linecap="round"/><g filter="url(#sh)"><rect x="533.0" y="92" width="154" height="32" rx="16" class="band2"/></g><text x="610" y="113" class="onac" font-size="13.5" font-weight="700" text-anchor="middle">CAFECA 錢包</text><path d="M610 124 V650" class="bands2" stroke-width="1.5" stroke-dasharray="2 5" stroke-linecap="round"/><g filter="url(#sh)"><rect x="757.0" y="92" width="170" height="32" rx="16" class="band3"/></g><text x="842" y="113" class="onac" font-size="13.5" font-weight="700" text-anchor="middle">Boltchain 公開 RPC</text><path d="M842 124 V650" class="bands3" stroke-width="1.5" stroke-dasharray="2 5" stroke-linecap="round"/><path d="M136 168 H366" fill="none" class="acs" stroke-width="2.5" stroke-linecap="round" marker-end="url(#ah)"/><rect x="178.8" y="142" width="142.5" height="22" rx="4" class="bg"/><circle cx="195.75" cy="153" r="11" fill="url(#gr)"/><text x="195.75" y="157.5" class="onac" font-size="12" font-weight="700" text-anchor="middle">1</text><text x="210.75" y="158" class="t1" font-size="12.5" font-weight="500" text-anchor="start">請求一次性 nonce</text><path d="M364 211.5 H134" fill="none" class="acs" stroke-width="2.5" stroke-dasharray="1 6" stroke-linecap="round" marker-end="url(#ah)"/><rect x="182.8" y="185.5" width="134.5" height="22" rx="4" class="bg"/><text x="188.75" y="201.5" class="t2" font-size="12.5" font-weight="400" text-anchor="start">nonce（只能用一次）</text><path d="M136 269.5 H606" fill="none" class="acs" stroke-width="2.5" stroke-linecap="round" marker-end="url(#ah)"/><rect x="227.0" y="243.5" width="286.0" height="22" rx="4" class="bg"/><circle cx="244.0" cy="254.5" r="11" fill="url(#gr)"/><text x="244.0" y="259.0" class="onac" font-size="12" font-weight="700" text-anchor="middle">2</text><text x="259.0" y="259.5" class="t1" font-size="12.5" font-weight="500" text-anchor="start">開啟 /dl/auth：網域、nonce、要求的資料</text><g filter="url(#sh)"><rect x="475.0" y="309.5" width="270" height="34" rx="10" class="note"/></g><circle cx="495.0" cy="326.5" r="11" fill="url(#gr)"/><text x="495.0" y="331.0" class="onac" font-size="12" font-weight="700" text-anchor="middle">3</text><text x="515.0" y="331.5" class="t1" font-size="12.5" font-weight="500" text-anchor="start">顯示你的網域，使用者逐項同意</text><g filter="url(#sh)"><rect x="475.0" y="361.7" width="270" height="34" rx="10" class="note"/></g><circle cx="495.0" cy="378.7" r="11" fill="url(#gr)"/><text x="495.0" y="383.2" class="onac" font-size="12" font-weight="700" text-anchor="middle">4</text><text x="515.0" y="383.7" class="t1" font-size="12.5" font-weight="500" text-anchor="start">Passkey 簽署 EIP-712 SignIn</text><path d="M604 437.70000000000005 H134" fill="none" class="acs" stroke-width="2.5" stroke-dasharray="1 6" stroke-linecap="round" marker-end="url(#ah)"/><rect x="230.2" y="411.70000000000005" width="279.5" height="22" rx="4" class="bg"/><circle cx="247.25" cy="422.70000000000005" r="11" fill="url(#gr)"/><text x="247.25" y="427.20000000000005" class="onac" font-size="12" font-weight="700" text-anchor="middle">5</text><text x="262.25" y="427.70000000000005" class="t2" font-size="12.5" font-weight="400" text-anchor="start">登入回應：account、signature、claims</text><path d="M136 495.70000000000005 H366" fill="none" class="acs" stroke-width="2.5" stroke-linecap="round" marker-end="url(#ah)"/><rect x="181.0" y="469.70000000000005" width="138.0" height="22" rx="4" class="bg"/><circle cx="198.0" cy="480.70000000000005" r="11" fill="url(#gr)"/><text x="198.0" y="485.20000000000005" class="onac" font-size="12" font-weight="700" text-anchor="middle">6</text><text x="213.0" y="485.70000000000005" class="t1" font-size="12.5" font-weight="500" text-anchor="start">原封不動轉交後端</text><path d="M376 553.7 H838" fill="none" class="ac2s" stroke-width="2.5" stroke-linecap="round" marker-end="url(#ah2)"/><rect x="415.8" y="527.7" width="380.5" height="22" rx="4" class="bg"/><circle cx="432.75" cy="538.7" r="11" fill="url(#gr)"/><text x="432.75" y="543.2" class="onac" font-size="12" font-weight="700" text-anchor="middle">7</text><text x="447.75" y="543.7" class="t1" font-size="12.5" font-weight="500" text-anchor="start">isValidSignature ⇒ 0x1626ba7e；statusOf ⇒ 實名等級</text><path d="M836 597.2 H374" fill="none" class="ac2s" stroke-width="2.5" stroke-dasharray="1 6" stroke-linecap="round" marker-end="url(#ah2)"/><rect x="543.8" y="571.2" width="124.5" height="22" rx="4" class="bg"/><text x="549.75" y="587.2" class="t2" font-size="12.5" font-weight="400" text-anchor="start">簽章有效、實名等級</text><g filter="url(#sh)"><rect x="205.0" y="634.3" width="330" height="34" rx="10" class="note"/></g><circle cx="225.0" cy="651.3" r="11" fill="url(#gr)"/><text x="225.0" y="655.8" class="onac" font-size="12" font-weight="700" text-anchor="middle">8</text><text x="245.0" y="656.3" class="t1" font-size="12.5" font-weight="500" text-anchor="start">建立你自己的 session（account 是使用者 ID）</text></svg>

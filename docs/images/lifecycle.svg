ont-weight="700" text-anchor="start">遺失裝置恢復</text><rect x="766" y="148" width="71.2" height="20" rx="10" class="tint2"/><text x="774" y="162" class="t1" font-size="11.5" font-weight="600" text-anchor="start" font-family='ui-monospace, SFMono-Regular, Menlo, Consolas, "Noto Sans Mono CJK TC", "PingFang TC", "Microsoft JhengHei", monospace'>/recover</text><text x="766" y="192" class="t2" font-size="12.5" font-weight="400" text-anchor="start">新裝置重新驗證本人</text><text x="766" y="213" class="t2" font-size="12.5" font-weight="400" text-anchor="start">48 小時（有卡 7 天）</text><text x="766" y="234" class="t2" font-size="12.5" font-weight="400" text-anchor="start">期間可取消、轉出凍結</text><path d="M766 258 H906" class="ln" stroke-width="1"/><text x="766" y="278" class="t3" font-size="11.5" font-weight="600" text-anchor="start">鏈上</text><text x="766" y="300" class="t1" font-size="12.5" font-weight="600" text-anchor="start" font-family='ui-monospace, SFMono-Regular, Menlo, Consolas, "Noto Sans Mono CJK TC", "PingFang TC", "Microsoft JhengHei", monospace'>RecoveryExecuted</text><text x="766" y="320" class="t1" font-size="12.5" font-weight="400" text-anchor="start">重新簽發實名證明</text><rect x="28" y="376" width="892" height="46" rx="12" class="note"/><text x="44" y="404" class="ac" font-size="13" font-weight="700" text-anchor="start">日常</text><text x="86" y="404" class="t2" font-size="12.5" font-weight="400" text-anchor="start">裝置 Passkey 在額度內轉帳與登入　·　任何裝置可用 /link 立即加入新裝置（所有裝置同級）　·　大額以 CAFECA 卡確認</text></svg>
